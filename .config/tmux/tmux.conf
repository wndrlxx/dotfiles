unbind C-b
set -g prefix C-a
set-window-option -g mode-keys vi

# Reload config with <prefix> r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

bind-key x kill-pane # remove confirmation
bind-key -n C-z resize-pane -Z
bind-key -r J resize-pane -D 4
bind-key -r K resize-pane -U 4
bind-key -r H resize-pane -L 4
bind-key -r L resize-pane -R 4
unbind k
bind k select-pane -U

# tpm
set -g @tpm-clean 'u'

# tmux-yank
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# switch mouse support on
set -g mouse on

# use vi keyboard shortcuts in copy mode
setw -g mode-keys vi

# split panes using | and -
bind "'" new-window
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# automatically restore tmux environment when tmux is started
set -g @continuum-restore 'on'

# List of plugins
# set -g @catppuccin_flavor 'latte' # or frappe, macchiato, mocha
set -g @catppuccin_window_status_style "rounded" # basic, rounded, slanted, custom, or none
set -g @catppuccin_window_current_text " #{b:pane_current_path}"
set -g @catppuccin_window_text " #{b:pane_current_path}"
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @vim_navigator_mapping_right ""  # preserve C-l to clear screen
set -g @cpu_percentage_format "%2.0f%%" # printf format to use to display percentage
set -g status-position top
set -g status-right-length 200
set -g status-left-length 200
set -g status-right "#{E:@catppuccin_status_session}"
set -g status-left "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -g @resurrect-strategy-vim 'session' # to resurrect vim

# initialize catpuccin/tmux manually (tpm not recommended)
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
 # prefix + U to update tmux plugins
run '~/.tmux/plugins/tpm/tpm'
